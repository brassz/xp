<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the outer circles -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A8CC;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the N letter -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099BB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="url(#circleGradient)" stroke-width="2"/>
  
  <!-- Inner circle -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="url(#circleGradient)" stroke-width="1.5"/>
  
  <!-- N letter -->
  <path d="M25 20 L25 35 L30 35 L30 25 L35 35 L35 20 Z" fill="url(#letterGradient)" stroke="url(#letterGradient)" stroke-width="1"/>
  
  <!-- Chart bars representing financial data -->
  <rect x="42" y="28" width="3" height="12" fill="url(#letterGradient)"/>
  <rect x="47" y="24" width="3" height="16" fill="url(#letterGradient)"/>
  <rect x="52" y="20" width="3" height="20" fill="url(#letterGradient)"/>
  
  <!-- Small chart line -->
  <path d="M20 45 L25 42 L30 45 L35 40 L40 43 L45 38 L50 35 L55 32" 
        fill="none" stroke="url(#circleGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small dots on the chart line -->
  <circle cx="20" cy="45" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="25" cy="42" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="30" cy="45" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="35" cy="40" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="40" cy="43" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="45" cy="38" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="50" cy="35" r="1.5" fill="url(#circleGradient)"/>
  <circle cx="55" cy="32" r="1.5" fill="url(#circleGradient)"/>
</svg>