<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for outer ring -->
    <linearGradient id="outerRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="50%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </linearGradient>
    
    <!-- Inner ring gradient -->
    <linearGradient id="innerRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48cae4"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    
    <!-- Background gradient -->
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#023e8a" stop-opacity="0.1"/>
      <stop offset="100%" style="stop-color:#03045e" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Letter N gradient -->
    <linearGradient id="letterNGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#caf0f8"/>
    </linearGradient>
    
    <!-- Chart gradient -->
    <linearGradient id="chartBarsGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="50%" style="stop-color:#48cae4"/>
      <stop offset="100%" style="stop-color:#90e0ef"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer decorative ring -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="url(#outerRingGradient)" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#innerRingGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Main background circle -->
  <circle cx="60" cy="60" r="42" fill="url(#backgroundGradient)" filter="url(#shadowEffect)"/>
  
  <!-- Letter N - More refined design -->
  <g transform="translate(32, 28)">
    <!-- Left vertical bar -->
    <rect x="0" y="0" width="5" height="24" fill="url(#letterNGradient)" rx="2"/>
    <!-- Right vertical bar -->
    <rect x="19" y="0" width="5" height="24" fill="url(#letterNGradient)" rx="2"/>
    <!-- Diagonal connector -->
    <path d="M 5 20 L 5 4 L 19 20 L 19 24 L 15 24 Z" fill="url(#letterNGradient)"/>
  </g>
  
  <!-- Financial chart bars - More elegant -->
  <g transform="translate(66, 38)">
    <!-- Bar 1 -->
    <rect x="0" y="12" width="3" height="12" fill="url(#chartBarsGradient)" rx="1.5"/>
    <!-- Bar 2 -->
    <rect x="5" y="8" width="3" height="16" fill="url(#chartBarsGradient)" rx="1.5"/>
    <!-- Bar 3 -->
    <rect x="10" y="4" width="3" height="20" fill="url(#chartBarsGradient)" rx="1.5"/>
    <!-- Bar 4 -->
    <rect x="15" y="10" width="3" height="14" fill="url(#chartBarsGradient)" rx="1.5"/>
    <!-- Bar 5 -->
    <rect x="20" y="6" width="3" height="18" fill="url(#chartBarsGradient)" rx="1.5"/>
  </g>
  
  <!-- Subtle accent dots -->
  <circle cx="60" cy="20" r="1" fill="#48cae4" opacity="0.6"/>
  <circle cx="100" cy="60" r="1" fill="#48cae4" opacity="0.6"/>
  <circle cx="60" cy="100" r="1" fill="#48cae4" opacity="0.6"/>
  <circle cx="20" cy="60" r="1" fill="#48cae4" opacity="0.6"/>
</svg>