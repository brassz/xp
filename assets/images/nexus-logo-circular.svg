<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer circle gradient -->
    <linearGradient id="outerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    
    <!-- Inner circle gradient -->
    <linearGradient id="innerCircleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    
    <!-- Letter N gradient -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#164e63"/>
    </linearGradient>
    
    <!-- Chart bars gradient -->
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#outerCircleGradient)" stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#innerCircleGradient)" stroke-width="2"/>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="45" fill="#f0fdff" opacity="0.1"/>
  
  <!-- Letter N -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="6" height="30" fill="url(#letterGradient)"/>
    <rect x="24" y="0" width="6" height="30" fill="url(#letterGradient)"/>
    <polygon points="6,25 6,5 24,25 24,30 18,30" fill="url(#letterGradient)"/>
  </g>
  
  <!-- Chart bars -->
  <g transform="translate(65, 35)">
    <!-- Bar 1 -->
    <rect x="0" y="15" width="4" height="15" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 2 -->
    <rect x="6" y="10" width="4" height="20" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 3 -->
    <rect x="12" y="5" width="4" height="25" fill="url(#chartGradient)" rx="1"/>
    <!-- Bar 4 -->
    <rect x="18" y="12" width="4" height="18" fill="url(#chartGradient)" rx="1"/>
  </g>
</svg>