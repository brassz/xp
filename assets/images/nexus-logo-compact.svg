<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Compact gradient -->
    <linearGradient id="compactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="50%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </linearGradient>
    
    <!-- Background -->
    <radialGradient id="compactBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#023e8a" stop-opacity="0.1"/>
      <stop offset="100%" style="stop-color:#03045e" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Letter gradient -->
    <linearGradient id="compactLetterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#caf0f8"/>
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="40" cy="40" r="38" fill="url(#compactBg)" stroke="url(#compactGradient)" stroke-width="2"/>
  
  <!-- Letter N -->
  <g transform="translate(22, 20)">
    <rect x="0" y="0" width="4" height="18" fill="url(#compactLetterGradient)" rx="1"/>
    <rect x="14" y="0" width="4" height="18" fill="url(#compactLetterGradient)" rx="1"/>
    <path d="M 4 15 L 4 3 L 14 15 L 14 18 L 11 18 Z" fill="url(#compactLetterGradient)"/>
  </g>
  
  <!-- Mini chart -->
  <g transform="translate(48, 28)">
    <rect x="0" y="8" width="2" height="8" fill="url(#compactGradient)" rx="1"/>
    <rect x="3" y="5" width="2" height="11" fill="url(#compactGradient)" rx="1"/>
    <rect x="6" y="3" width="2" height="13" fill="url(#compactGradient)" rx="1"/>
    <rect x="9" y="6" width="2" height="10" fill="url(#compactGradient)" rx="1"/>
  </g>
</svg>