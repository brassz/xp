<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8"/>
    </radialGradient>
    
    <!-- Text gradient for NEXUS -->
    <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    
    <!-- Text gradient for subtitle -->
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)"/>
  
  <!-- Light rays effect -->
  <g opacity="0.6">
    <line x1="200" y1="150" x2="50" y2="50" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
    <line x1="200" y1="150" x2="100" y2="30" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="150" x2="300" y2="30" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="150" x2="350" y2="50" stroke="#ec4899" stroke-width="2" opacity="0.3"/>
    <line x1="200" y1="150" x2="370" y2="120" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="150" x2="30" y2="120" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- NEXUS text -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="url(#nexusGradient)" letter-spacing="2px">
    NEXUS
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="500" 
        text-anchor="middle" fill="url(#subtitleGradient)" letter-spacing="3px">
    CONTROLE FINANCEIRO
  </text>
</svg>