<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste EmailJS - Sistema de Verificação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">Teste de Configuração EmailJS</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">Configurações Atuais</h2>
            <div class="space-y-2 text-sm font-mono">
                <div><strong>Service ID:</strong> service_0ap0m1k</div>
                <div><strong>Template ID:</strong> template_z3n0654</div>
                <div><strong>Public Key:</strong> UsJiG8it4NxqAcHkW</div>
                <div><strong>Email Destino:</strong> brasszgc@gmail.com</div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">Teste de Envio</h2>
            
            <div class="space-y-4">
                <button id="testEmailBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded text-white font-semibold w-full">
                    Enviar Email de Teste
                </button>
                
                <div id="testResult" class="p-4 rounded bg-gray-700 hidden">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-semibold mb-4">Status da Biblioteca</h2>
            <div id="libraryStatus" class="text-sm"></div>
        </div>
    </div>

    <script>
        // Configurações
        const EMAILJS_CONFIG = {
            serviceId: 'service_0ap0m1k',
            templateId: 'template_z3n0654',
            publicKey: 'UsJiG8it4NxqAcHkW'
        };

        // Verificar status da biblioteca
        function checkLibraryStatus() {
            const statusDiv = document.getElementById('libraryStatus');
            
            if (typeof emailjs !== 'undefined') {
                statusDiv.innerHTML = `
                    <div class="text-green-400">✅ EmailJS carregado com sucesso</div>
                    <div class="text-gray-300 mt-2">Versão: ${emailjs.version || 'Desconhecida'}</div>
                `;
                
                // Inicializar EmailJS
                emailjs.init(EMAILJS_CONFIG.publicKey);
                
            } else {
                statusDiv.innerHTML = `
                    <div class="text-red-400">❌ EmailJS não foi carregado</div>
                    <div class="text-gray-300 mt-2">Verifique a conexão com a internet</div>
                `;
            }
        }

        // Função de teste de envio
        async function testEmailSend() {
            const btn = document.getElementById('testEmailBtn');
            const resultDiv = document.getElementById('testResult');
            const resultContent = document.getElementById('resultContent');
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            resultDiv.classList.remove('hidden');
            
            try {
                const testCode = Math.floor(100000 + Math.random() * 900000).toString();
                
                resultContent.innerHTML = `
                    <div class="text-blue-400">🔄 Enviando email...</div>
                    <div class="text-gray-300 text-sm mt-1">Código gerado: ${testCode}</div>
                `;

                const result = await emailjs.send(
                    EMAILJS_CONFIG.serviceId,
                    EMAILJS_CONFIG.templateId,
                    {
                        to_email: 'brasszgc@gmail.com',
                        verification_code: testCode,
                        system_name: 'Nexus Gestão Financeira - TESTE',
                        expiry_time: '5 minutos'
                    }
                );

                resultContent.innerHTML = `
                    <div class="text-green-400">✅ Email enviado com sucesso!</div>
                    <div class="text-gray-300 text-sm mt-2">
                        <div><strong>Status:</strong> ${result.status}</div>
                        <div><strong>Texto:</strong> ${result.text}</div>
                        <div><strong>Código enviado:</strong> ${testCode}</div>
                        <div class="mt-2 text-yellow-300">Verifique a caixa de entrada de brasszgc@gmail.com</div>
                    </div>
                `;

            } catch (error) {
                console.error('Erro no teste:', error);
                resultContent.innerHTML = `
                    <div class="text-red-400">❌ Erro ao enviar email</div>
                    <div class="text-gray-300 text-sm mt-2">
                        <div><strong>Erro:</strong> ${error.message || error}</div>
                        <div class="mt-2">Possíveis causas:</div>
                        <ul class="list-disc list-inside text-xs mt-1">
                            <li>Service ID incorreto</li>
                            <li>Template ID incorreto</li>
                            <li>Public Key incorreta</li>
                            <li>Template não configurado corretamente</li>
                            <li>Serviço de email não configurado</li>
                        </ul>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Email de Teste';
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            checkLibraryStatus();
            document.getElementById('testEmailBtn').addEventListener('click', testEmailSend);
        });
    </script>
</body>
</html>
