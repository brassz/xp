<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Sistema de Verificação</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6">Teste do Sistema de Verificação</h1>
        
        <div class="space-y-4">
            <button id="testGenerateCode" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">
                Gerar Código
            </button>
            
            <div>
                <input type="text" id="testCodeInput" placeholder="Digite o código" class="bg-gray-800 text-white px-3 py-2 rounded w-full">
            </div>
            
            <button id="testValidateCode" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-white">
                Validar Código
            </button>
            
            <div id="testResult" class="mt-4 p-3 rounded bg-gray-800"></div>
        </div>
    </div>

    <script>
        // Funções de teste
        let testCode = null;
        
        function generateTestCode() {
            testCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('testResult').innerHTML = `
                <strong>Código gerado:</strong> ${testCode}<br>
                <small>Este código seria enviado para brasszgc@gmail.com</small>
            `;
        }
        
        function validateTestCode() {
            const input = document.getElementById('testCodeInput').value;
            const result = document.getElementById('testResult');
            
            if (!testCode) {
                result.innerHTML = '<span class="text-red-400">Nenhum código foi gerado ainda!</span>';
                return;
            }
            
            if (input === testCode) {
                result.innerHTML = '<span class="text-green-400">✓ Código válido! Login seria permitido.</span>';
            } else {
                result.innerHTML = '<span class="text-red-400">✗ Código inválido!</span>';
            }
        }
        
        // Event listeners
        document.getElementById('testGenerateCode').addEventListener('click', generateTestCode);
        document.getElementById('testValidateCode').addEventListener('click', validateTestCode);
    </script>
</body>
</html>
