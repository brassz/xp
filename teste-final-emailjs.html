<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Final EmailJS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">🎯 Teste Final - EmailJS</h1>
        
        <div class="bg-blue-900 p-6 rounded-lg mb-6 border border-blue-500">
            <h2 class="text-xl font-semibold mb-4">📋 Configuração Final</h2>
            <div class="space-y-2 font-mono text-sm">
                <div><span class="text-gray-400">Service ID:</span> <span class="text-green-400">service_v104fpg</span></div>
                <div><span class="text-gray-400">Template ID:</span> <span class="text-green-400">template_pupk1rk</span></div>
                <div><span class="text-gray-400">Public Key:</span> <span class="text-green-400">UsJiG8it4NxqAcHkW</span></div>
                <div><span class="text-gray-400">Email:</span> <span class="text-yellow-400">assonibrassz@gmail.com</span></div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <button id="sendTest" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-8 py-4 rounded-lg text-white font-bold w-full text-lg">
                🚀 ENVIAR CÓDIGO DE TESTE
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-3">Resultado:</h3>
            <div id="log" class="bg-black p-4 rounded font-mono text-sm h-80 overflow-y-auto">
                Pronto para teste final...
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            serviceId: 'service_v104fpg',
            templateId: 'template_pupk1rk',
            publicKey: 'UsJiG8it4NxqAcHkW',
            email: 'assonibrassz@gmail.com'
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400'
            };
            
            logDiv.innerHTML += `<div class="${colors[type]}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function sendTest() {
            const btn = document.getElementById('sendTest');
            btn.disabled = true;
            btn.textContent = '📤 ENVIANDO...';
            
            try {
                log('🚀 === TESTE FINAL INICIADO ===', 'warning');
                log('', 'info');
                
                // Verificações iniciais
                log('1️⃣ Verificando EmailJS...', 'info');
                if (typeof emailjs === 'undefined') {
                    throw new Error('EmailJS não carregado');
                }
                log('   ✅ EmailJS disponível', 'success');
                
                // Inicializar
                log('2️⃣ Inicializando EmailJS...', 'info');
                emailjs.init(CONFIG.publicKey);
                log('   ✅ EmailJS inicializado', 'success');
                
                // Gerar código
                log('3️⃣ Gerando código de verificação...', 'info');
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                log(`   🔢 Código gerado: ${code}`, 'success');
                
                // Mostrar configurações
                log('4️⃣ Configurações do envio:', 'info');
                log(`   📋 Service: ${CONFIG.serviceId}`, 'info');
                log(`   📋 Template: ${CONFIG.templateId}`, 'info');
                log(`   📧 Para: ${CONFIG.email}`, 'info');
                
                // Enviar
                log('5️⃣ Enviando email...', 'warning');
                
                const result = await emailjs.send(
                    CONFIG.serviceId,
                    CONFIG.templateId,
                    {
                        to_email: CONFIG.email,
                        verification_code: code,
                        code: code,
                        otp: code,
                        message: `Seu código de verificação: ${code}`,
                        system_name: 'Nexus Gestão Financeira'
                    }
                );
                
                log('', 'info');
                log('🎉 === EMAIL ENVIADO COM SUCESSO! ===', 'success');
                log(`✅ Status: ${result.status}`, 'success');
                log(`✅ Resposta: ${result.text}`, 'success');
                log('', 'info');
                log('📧 VERIFIQUE SEU EMAIL: assonibrassz@gmail.com', 'warning');
                log('📧 Verifique também a pasta SPAM', 'warning');
                log(`🔢 Procure pelo código: ${code}`, 'warning');
                log('', 'info');
                log('🎊 SISTEMA DE VERIFICAÇÃO 100% FUNCIONAL!', 'success');
                
                btn.textContent = '✅ EMAIL ENVIADO!';
                btn.className = 'bg-gradient-to-r from-green-600 to-green-700 px-8 py-4 rounded-lg text-white font-bold w-full text-lg';
                
            } catch (error) {
                log('', 'info');
                log('❌ === ERRO NO ENVIO ===', 'error');
                log(`❌ Status: ${error.status || 'N/A'}`, 'error');
                log(`❌ Mensagem: ${error.message}`, 'error');
                log(`❌ Texto: ${error.text || 'N/A'}`, 'error');
                
                if (error.status === 422) {
                    log('', 'info');
                    log('💡 DIAGNÓSTICO ERRO 422:', 'warning');
                    log('   - Template template_pupk1rk não existe', 'warning');
                    log('   - Template não está ativo', 'warning');
                    log('   - Parâmetros incorretos no template', 'warning');
                } else if (error.status === 401) {
                    log('💡 DIAGNÓSTICO ERRO 401: Public Key incorreta', 'warning');
                } else if (error.status === 404) {
                    log('💡 DIAGNÓSTICO ERRO 404: Service ou Template não encontrado', 'warning');
                }
                
                btn.textContent = '❌ ERRO NO ENVIO';
                btn.className = 'bg-gradient-to-r from-red-600 to-red-700 px-8 py-4 rounded-lg text-white font-bold w-full text-lg';
                
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🚀 ENVIAR CÓDIGO DE TESTE';
                    btn.className = 'bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-8 py-4 rounded-lg text-white font-bold w-full text-lg';
                }, 5000);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('🎯 Sistema pronto para teste final!', 'success');
            log('📋 Configurações atualizadas com template_pupk1rk', 'info');
            log('', 'info');
            log('Clique no botão para testar o envio...', 'warning');
            
            document.getElementById('sendTest').addEventListener('click', sendTest);
        });
    </script>
</body>
</html>
