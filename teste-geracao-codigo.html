<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Geração de Código</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">🔍 Teste Geração de Código</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">🧪 Testes Individuais</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <button id="testGenerate" class="bg-blue-600 hover:bg-blue-700 px-4 py-3 rounded text-white">
                    1. Testar Geração
                </button>
                
                <button id="testEmailJS" class="bg-green-600 hover:bg-green-700 px-4 py-3 rounded text-white">
                    2. Testar EmailJS
                </button>
                
                <button id="testSend" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-3 rounded text-white">
                    3. Testar Envio
                </button>
                
                <button id="testComplete" class="bg-purple-600 hover:bg-purple-700 px-4 py-3 rounded text-white">
                    4. Teste Completo
                </button>
                
                <button id="testButton" class="bg-red-600 hover:bg-red-700 px-4 py-3 rounded text-white">
                    5. Testar Botão
                </button>
                
                <button id="testValidation" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-3 rounded text-white">
                    6. Testar Validação
                </button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">📊 Status das Variáveis</h2>
            <div id="statusDisplay" class="bg-black p-4 rounded font-mono text-sm">
                Clique em "Teste Completo" para ver o status...
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-3">Log Detalhado:</h3>
            <div id="testLog" class="bg-black p-4 rounded font-mono text-sm h-96 overflow-y-auto">
                Sistema pronto para testar geração de código...
            </div>
            <button id="clearLog" class="mt-2 bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white text-sm">
                Limpar Log
            </button>
        </div>
    </div>

    <script>
        // Configurações
        const CONFIG = {
            serviceId: 'service_0ap0m1k',
            templateId: 'template_z3n0654',
            publicKey: 'UsJiG8it4NxqAcHkW',
            email: 'assonibrassz@gmail.com'
        };

        // Variáveis globais (simulando o sistema principal)
        let verificationCode = null;
        let verificationEmail = CONFIG.email;
        let isCodeSent = false;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400'
            };
            
            logDiv.innerHTML += `<div class="${colors[type]}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus() {
            const statusDiv = document.getElementById('statusDisplay');
            statusDiv.innerHTML = `
                <div>verificationCode: ${verificationCode || 'null'}</div>
                <div>verificationEmail: ${verificationEmail}</div>
                <div>isCodeSent: ${isCodeSent}</div>
                <div>EmailJS disponível: ${typeof emailjs !== 'undefined'}</div>
                <div>Timestamp: ${new Date().toLocaleTimeString()}</div>
            `;
        }

        // Função de geração (copiada do sistema principal)
        function generateVerificationCode() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            log(`🔢 Código gerado: ${code}`, 'success');
            return code;
        }

        // Teste 1: Geração de código
        function testGenerate() {
            log('=== TESTE 1: Geração de Código ===', 'warning');
            
            try {
                for (let i = 0; i < 5; i++) {
                    const code = generateVerificationCode();
                    log(`Código ${i + 1}: ${code}`, 'info');
                }
                log('✅ Geração funcionando corretamente', 'success');
            } catch (error) {
                log(`❌ Erro na geração: ${error.message}`, 'error');
            }
            
            updateStatus();
        }

        // Teste 2: EmailJS
        function testEmailJS() {
            log('=== TESTE 2: EmailJS ===', 'warning');
            
            if (typeof emailjs === 'undefined') {
                log('❌ EmailJS não carregado', 'error');
                return;
            }
            
            log('✅ EmailJS disponível', 'success');
            
            try {
                emailjs.init(CONFIG.publicKey);
                log('✅ EmailJS inicializado', 'success');
            } catch (error) {
                log(`❌ Erro ao inicializar: ${error.message}`, 'error');
            }
            
            updateStatus();
        }

        // Teste 3: Envio
        async function testSend() {
            log('=== TESTE 3: Envio de Email ===', 'warning');
            
            try {
                verificationCode = generateVerificationCode();
                
                emailjs.init(CONFIG.publicKey);
                
                const result = await emailjs.send(
                    CONFIG.serviceId,
                    CONFIG.templateId,
                    {
                        to_email: CONFIG.email,
                        verification_code: verificationCode,
                        code: verificationCode,
                        otp: verificationCode,
                        message: `Código: ${verificationCode}`
                    }
                );
                
                log('✅ Email enviado com sucesso!', 'success');
                log(`Status: ${result.status}`, 'success');
                log('📧 Verifique: assonibrassz@gmail.com', 'warning');
                
                isCodeSent = true;
                
            } catch (error) {
                log(`❌ Erro no envio: ${error.status} - ${error.message}`, 'error');
            }
            
            updateStatus();
        }

        // Teste 4: Completo
        async function testComplete() {
            log('=== TESTE 4: Fluxo Completo ===', 'warning');
            
            // Reset
            verificationCode = null;
            isCodeSent = false;
            
            log('1. Gerando código...', 'info');
            verificationCode = generateVerificationCode();
            
            log('2. Inicializando EmailJS...', 'info');
            emailjs.init(CONFIG.publicKey);
            
            log('3. Enviando email...', 'info');
            try {
                const result = await emailjs.send(
                    CONFIG.serviceId,
                    CONFIG.templateId,
                    {
                        to_email: CONFIG.email,
                        verification_code: verificationCode,
                        code: verificationCode
                    }
                );
                
                log('✅ Fluxo completo executado com sucesso!', 'success');
                isCodeSent = true;
                
            } catch (error) {
                log(`❌ Falha no fluxo: ${error.message}`, 'error');
            }
            
            updateStatus();
        }

        // Teste 5: Botão (simular clique)
        function testButton() {
            log('=== TESTE 5: Simulação de Botão ===', 'warning');
            
            log('Simulando clique no botão "Enviar Código"...', 'info');
            
            // Simular o que acontece quando clica no botão
            testComplete();
        }

        // Teste 6: Validação
        function testValidation() {
            log('=== TESTE 6: Validação de Código ===', 'warning');
            
            if (!verificationCode) {
                log('❌ Nenhum código foi gerado ainda', 'error');
                return;
            }
            
            // Testar validação correta
            const isValid1 = verificationCode === verificationCode;
            log(`Validação código correto: ${isValid1}`, isValid1 ? 'success' : 'error');
            
            // Testar validação incorreta
            const isValid2 = '000000' === verificationCode;
            log(`Validação código incorreto: ${!isValid2}`, !isValid2 ? 'success' : 'error');
            
            updateStatus();
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Sistema de teste iniciado', 'success');
            log('🎯 Objetivo: Descobrir por que o código não está sendo gerado', 'info');
            log('', 'info');
            log('Execute os testes na ordem para diagnosticar:', 'warning');
            
            updateStatus();
            
            document.getElementById('testGenerate').addEventListener('click', testGenerate);
            document.getElementById('testEmailJS').addEventListener('click', testEmailJS);
            document.getElementById('testSend').addEventListener('click', testSend);
            document.getElementById('testComplete').addEventListener('click', testComplete);
            document.getElementById('testButton').addEventListener('click', testButton);
            document.getElementById('testValidation').addEventListener('click', testValidation);
            
            document.getElementById('clearLog').addEventListener('click', () => {
                document.getElementById('testLog').innerHTML = '';
                log('Log limpo', 'info');
            });
        });
    </script>
</body>
</html>
