<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Configuração Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold mb-6 text-center text-green-400">🎯 TESTE FINAL</h1>
        
        <div class="bg-green-900 p-6 rounded-lg mb-6 border border-green-500">
            <h2 class="text-2xl font-semibold mb-4">✅ Configuração Final Correta</h2>
            <div class="grid grid-cols-2 gap-4 font-mono text-lg">
                <div><strong>Service ID:</strong></div>
                <div class="text-green-400">service_cptfbdq</div>
                <div><strong>Template ID:</strong></div>
                <div class="text-green-400">template_pupk1rk</div>
                <div><strong>Public Key:</strong></div>
                <div class="text-green-400">UsJiG8it4NxqAcHkW</div>
                <div><strong>Email Destino:</strong></div>
                <div class="text-yellow-400">assonibrassz@gmail.com</div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <button id="testFinal" class="bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 px-8 py-6 rounded-lg text-white font-bold w-full text-2xl">
                🚀 TESTE FINAL - ENVIAR CÓDIGO
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-xl font-semibold mb-3">Resultado Final:</h3>
            <div id="result" class="bg-black p-4 rounded font-mono text-sm h-80 overflow-y-auto">
                Pronto para o teste final com configurações corretas...
            </div>
        </div>
    </div>

    <script>
        // Configuração final correta
        const CONFIG = {
            serviceId: 'service_cptfbdq',
            templateId: 'template_pupk1rk',
            publicKey: 'UsJiG8it4NxqAcHkW',
            email: 'assonibrassz@gmail.com'
        };

        function log(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400'
            };
            
            resultDiv.innerHTML += `<div class="${colors[type]}">[${timestamp}] ${message}</div>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }

        async function testFinal() {
            const btn = document.getElementById('testFinal');
            btn.disabled = true;
            btn.textContent = '📤 ENVIANDO...';
            
            try {
                log('🎯 === TESTE FINAL COM CONFIGURAÇÕES CORRETAS ===', 'warning');
                log('', 'info');
                
                // Verificações
                log('1️⃣ Verificando EmailJS...', 'info');
                if (typeof emailjs === 'undefined') {
                    throw new Error('EmailJS não carregado');
                }
                log('   ✅ EmailJS disponível', 'success');
                
                // Inicializar
                log('2️⃣ Inicializando com Public Key...', 'info');
                emailjs.init(CONFIG.publicKey);
                log('   ✅ EmailJS inicializado', 'success');
                
                // Gerar código
                log('3️⃣ Gerando código de verificação...', 'info');
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                log(`   🔢 Código gerado: ${code}`, 'success');
                
                // Mostrar configurações finais
                log('4️⃣ Configurações do envio:', 'info');
                log(`   📋 Service ID: ${CONFIG.serviceId}`, 'info');
                log(`   📋 Template ID: ${CONFIG.templateId}`, 'info');
                log(`   📧 Email destino: ${CONFIG.email}`, 'info');
                
                // Tentar envio com múltiplos formatos
                log('5️⃣ Tentando envio com diferentes formatos...', 'warning');
                
                const formats = [
                    {
                        name: 'Formato Padrão',
                        params: {
                            to_email: CONFIG.email,
                            verification_code: code,
                            system_name: 'Nexus Gestão Financeira'
                        }
                    },
                    {
                        name: 'Formato Simples',
                        params: {
                            to_email: CONFIG.email,
                            code: code
                        }
                    },
                    {
                        name: 'Formato Message',
                        params: {
                            to_email: CONFIG.email,
                            message: `Código de verificação: ${code}`
                        }
                    },
                    {
                        name: 'Formato Mínimo',
                        params: {
                            email: CONFIG.email,
                            verification_code: code
                        }
                    }
                ];
                
                let success = false;
                let successFormat = null;
                
                for (const format of formats) {
                    try {
                        log(`   🔄 Testando ${format.name}...`, 'info');
                        
                        const result = await emailjs.send(
                            CONFIG.serviceId,
                            CONFIG.templateId,
                            format.params
                        );
                        
                        log(`   🎉 ${format.name} FUNCIONOU!`, 'success');
                        log(`   Status: ${result.status}`, 'success');
                        log(`   Resposta: ${result.text}`, 'success');
                        
                        success = true;
                        successFormat = format;
                        break;
                        
                    } catch (error) {
                        log(`   ❌ ${format.name} falhou: ${error.status} - ${error.message}`, 'error');
                    }
                }
                
                log('', 'info');
                
                if (success) {
                    log('🎊 === EMAIL ENVIADO COM SUCESSO! ===', 'success');
                    log('', 'info');
                    log('✅ SISTEMA 100% FUNCIONAL!', 'success');
                    log(`✅ Formato que funciona: ${successFormat.name}`, 'success');
                    log(`✅ Parâmetros: ${JSON.stringify(successFormat.params)}`, 'success');
                    log('', 'info');
                    log('📧 VERIFIQUE O EMAIL: assonibrassz@gmail.com', 'warning');
                    log('📧 Verifique também a pasta SPAM', 'warning');
                    log(`🔢 Procure pelo código: ${code}`, 'warning');
                    log('', 'info');
                    log('🎯 PRÓXIMOS PASSOS:', 'warning');
                    log('1. Confirme que recebeu o email', 'info');
                    log('2. Use o sistema principal para login', 'info');
                    log('3. Sistema está pronto para produção!', 'info');
                    
                    btn.textContent = '🎉 EMAIL ENVIADO COM SUCESSO!';
                    btn.className = 'bg-gradient-to-r from-green-500 to-green-600 px-8 py-6 rounded-lg text-white font-bold w-full text-2xl';
                    
                } else {
                    log('❌ === TODOS OS FORMATOS FALHARAM ===', 'error');
                    log('', 'info');
                    log('🔍 POSSÍVEIS CAUSAS:', 'warning');
                    log('1. Template template_pupk1rk não existe', 'error');
                    log('2. Template não está ativo no painel', 'error');
                    log('3. Service service_cptfbdq não está conectado', 'error');
                    log('4. Template não tem variáveis configuradas', 'error');
                    log('', 'info');
                    log('💡 SOLUÇÕES:', 'warning');
                    log('1. Verifique se o template existe no painel EmailJS', 'info');
                    log('2. Ative o template se estiver desabilitado', 'info');
                    log('3. Configure variáveis no template ({{to_email}}, {{code}})', 'info');
                    log('4. Teste com template diferente', 'info');
                    
                    btn.textContent = '❌ FALHA - VERIFICAR TEMPLATE';
                    btn.className = 'bg-gradient-to-r from-red-500 to-red-600 px-8 py-6 rounded-lg text-white font-bold w-full text-2xl';
                }
                
            } catch (error) {
                log('❌ ERRO GERAL:', 'error');
                log(`Mensagem: ${error.message}`, 'error');
                
                btn.textContent = '❌ ERRO GERAL';
                btn.className = 'bg-gradient-to-r from-red-500 to-red-600 px-8 py-6 rounded-lg text-white font-bold text-2xl';
                
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🚀 TESTE FINAL - ENVIAR CÓDIGO';
                    btn.className = 'bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 px-8 py-6 rounded-lg text-white font-bold w-full text-2xl';
                }, 10000);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('🎯 TESTE FINAL PRONTO!', 'success');
            log('', 'info');
            log('📋 Configurações atualizadas:', 'info');
            log(`   Service: ${CONFIG.serviceId}`, 'info');
            log(`   Template: ${CONFIG.templateId}`, 'info');
            log(`   Email: ${CONFIG.email}`, 'info');
            log('', 'info');
            log('🚀 Clique no botão para o teste final!', 'warning');
            log('', 'info');
            log('Este teste vai:', 'info');
            log('✅ Verificar todas as configurações', 'info');
            log('✅ Testar múltiplos formatos de parâmetros', 'info');
            log('✅ Mostrar exatamente o que funciona', 'info');
            log('✅ Dar diagnóstico completo se falhar', 'info');
            
            document.getElementById('testFinal').addEventListener('click', testFinal);
        });
    </script>
</body>
</html>
