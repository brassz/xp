<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Parâmetros Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">🔍 Teste Parâmetros Template</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">Template: template_z3n0654</h2>
            <p class="text-gray-300">Vamos testar diferentes combinações de parâmetros para descobrir o que o template espera.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
            <button id="test1" class="bg-blue-600 hover:bg-blue-700 px-4 py-3 rounded text-white">
                Teste 1: Sem Parâmetros
            </button>
            
            <button id="test2" class="bg-green-600 hover:bg-green-700 px-4 py-3 rounded text-white">
                Teste 2: Só Email
            </button>
            
            <button id="test3" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-3 rounded text-white">
                Teste 3: Email + Código
            </button>
            
            <button id="test4" class="bg-purple-600 hover:bg-purple-700 px-4 py-3 rounded text-white">
                Teste 4: Parâmetros Atuais
            </button>
            
            <button id="test5" class="bg-red-600 hover:bg-red-700 px-4 py-3 rounded text-white">
                Teste 5: Parâmetros Simples
            </button>
            
            <button id="test6" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-3 rounded text-white">
                Teste 6: Parâmetros Comuns
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-3">Log de Testes:</h3>
            <div id="testLog" class="bg-black p-4 rounded font-mono text-sm h-96 overflow-y-auto">
                Pronto para testar diferentes parâmetros...
            </div>
            <button id="clearLog" class="mt-2 bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-white text-sm">
                Limpar Log
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            serviceId: 'service_0ap0m1k',
            templateId: 'template_z3n0654',
            publicKey: 'UsJiG8it4NxqAcHkW',
            email: 'assonibrassz@gmail.com'
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400'
            };
            
            logDiv.innerHTML += `<div class="${colors[type]}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testTemplate(testName, params) {
            log(`=== ${testName} ===`, 'warning');
            log(`Parâmetros: ${JSON.stringify(params, null, 2)}`, 'info');
            
            try {
                emailjs.init(CONFIG.publicKey);
                
                const result = await emailjs.send(
                    CONFIG.serviceId,
                    CONFIG.templateId,
                    params
                );
                
                log(`✅ SUCESSO! Status: ${result.status}`, 'success');
                log(`Resposta: ${result.text}`, 'success');
                log('📧 Verifique o email: assonibrassz@gmail.com', 'warning');
                return true;
                
            } catch (error) {
                log(`❌ ERRO: Status ${error.status}`, 'error');
                log(`Mensagem: ${error.message}`, 'error');
                log(`Texto: ${error.text || 'N/A'}`, 'error');
                return false;
            }
        }

        // Teste 1: Sem parâmetros
        async function test1() {
            await testTemplate('TESTE 1: Sem Parâmetros', {});
        }

        // Teste 2: Só email
        async function test2() {
            await testTemplate('TESTE 2: Só Email', {
                to_email: CONFIG.email
            });
        }

        // Teste 3: Email + código
        async function test3() {
            await testTemplate('TESTE 3: Email + Código', {
                to_email: CONFIG.email,
                verification_code: '123456'
            });
        }

        // Teste 4: Parâmetros atuais (que dão erro)
        async function test4() {
            await testTemplate('TESTE 4: Parâmetros Atuais', {
                to_email: CONFIG.email,
                verification_code: '123456',
                system_name: 'Nexus Gestão Financeira',
                expiry_time: '5 minutos'
            });
        }

        // Teste 5: Parâmetros simples
        async function test5() {
            await testTemplate('TESTE 5: Parâmetros Simples', {
                email: CONFIG.email,
                code: '123456',
                message: 'Teste simples'
            });
        }

        // Teste 6: Parâmetros comuns do EmailJS
        async function test6() {
            await testTemplate('TESTE 6: Parâmetros Comuns', {
                user_email: CONFIG.email,
                user_name: 'Usuário Teste',
                message: 'Código de verificação: 123456'
            });
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Sistema de teste iniciado', 'success');
            log('🎯 Template: template_z3n0654', 'info');
            log('📧 Email: assonibrassz@gmail.com', 'info');
            log('', 'info');
            log('Execute os testes na ordem para descobrir quais parâmetros funcionam:', 'warning');
            
            document.getElementById('test1').addEventListener('click', test1);
            document.getElementById('test2').addEventListener('click', test2);
            document.getElementById('test3').addEventListener('click', test3);
            document.getElementById('test4').addEventListener('click', test4);
            document.getElementById('test5').addEventListener('click', test5);
            document.getElementById('test6').addEventListener('click', test6);
            
            document.getElementById('clearLog').addEventListener('click', () => {
                document.getElementById('testLog').innerHTML = '';
                log('Log limpo', 'info');
            });
        });
    </script>
</body>
</html>
