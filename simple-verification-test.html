<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples - Verificação EmailJS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">Teste Simples EmailJS</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">Configurações</h2>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div><strong>Service ID:</strong></div>
                <div class="font-mono">service_0ap0m1k</div>
                <div><strong>Template ID:</strong></div>
                <div class="font-mono">template_z3n0654</div>
                <div><strong>Public Key:</strong></div>
                <div class="font-mono">UsJiG8it4NxqAcHkW</div>
                <div><strong>Para:</strong></div>
                <div class="font-mono">brasszgc@gmail.com</div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <button id="sendTestEmail" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded text-white font-semibold w-full">
                Enviar Email de Teste
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-3">Resultado:</h3>
            <div id="result" class="bg-black p-4 rounded font-mono text-sm min-h-[100px]">
                Clique no botão para testar...
            </div>
        </div>
    </div>

    <script>
        function log(message) {
            const resultDiv = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            resultDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('result').innerHTML = '';
        }

        async function sendTestEmail() {
            const button = document.getElementById('sendTestEmail');
            button.disabled = true;
            button.textContent = 'Enviando...';
            
            clearLog();
            
            try {
                log('🔄 Iniciando teste...');
                
                // Verificar se EmailJS está carregado
                if (typeof emailjs === 'undefined') {
                    throw new Error('EmailJS não está carregado');
                }
                log('✅ EmailJS carregado');
                
                // Gerar código
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                log(`🔢 Código gerado: ${code}`);
                
                // Configurar EmailJS
                log('🔧 Configurando EmailJS...');
                emailjs.init('UsJiG8it4NxqAcHkW');
                log('✅ EmailJS configurado');
                
                // Preparar dados
                const templateParams = {
                    to_email: 'brasszgc@gmail.com',
                    verification_code: code,
                    system_name: 'Nexus - Teste Simples',
                    expiry_time: '5 minutos'
                };
                
                log('📧 Enviando email...');
                log(`📋 Dados: ${JSON.stringify(templateParams, null, 2)}`);
                
                // Enviar email
                const result = await emailjs.send(
                    'service_0ap0m1k',
                    'template_z3n0654',
                    templateParams
                );
                
                log(`🎉 SUCESSO! Status: ${result.status}`);
                log(`📨 Resposta: ${result.text}`);
                log('📬 Verifique o email em brasszgc@gmail.com');
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                log(`🔍 Detalhes: ${JSON.stringify(error, null, 2)}`);
                
                // Diagnósticos adicionais
                if (error.message.includes('400')) {
                    log('💡 Erro 400: Verifique se o template existe e está ativo');
                }
                if (error.message.includes('401')) {
                    log('💡 Erro 401: Verifique a Public Key');
                }
                if (error.message.includes('404')) {
                    log('💡 Erro 404: Verifique Service ID e Template ID');
                }
            } finally {
                button.disabled = false;
                button.textContent = 'Enviar Email de Teste';
            }
        }

        // Event listener
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('sendTestEmail').addEventListener('click', sendTestEmail);
            log('🚀 Sistema pronto para teste');
        });
    </script>
</body>
</html>
